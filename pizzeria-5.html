<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--
  LA PIZZERÍA DE NICK · fracciones equivalentes con grapadora
  Prototipo v0.3 · © Andrés Asensio · CC BY-NC-SA 4.0

  LA IDEA. Cortar reparte; GRAPAR junta. La equivalencia deja de enunciarse y
  pasa a ser el resultado de un gesto: junto dos cuartos contiguos y me sale
  exactamente una mitad.

  LO QUE AÑADE ESTA VERSIÓN: LA ESCALERA DE COMPARACIÓN
  El servicio ahora tiene dos turnos. Primero se sirve —los gestos de siempre:
  grapar, recortar, la segunda caja, el denominador común para juntar—; después
  se COMPARA, que es el plato fuerte, y se compara en el orden en que se
  demuestra:
  1. MISMO DENOMINADOR (3/8 y 5/8): trozos iguales, basta contar trozos.
  2. MISMO NUMERADOR (1/3 y 1/4): más partes tocan a menos; 1/4 < 1/3
     aunque 4 > 3.
  3. UN DENOMINADOR CABE EN EL OTRO (3/4 y 5/8): recortando UNA caja quedan
     igualadas.
  4. NI UNO CABE EN EL OTRO (2/3 y 3/5): hay que cortar LAS DOS, y en quince
     caben los dos cortes. Ponerlas en la misma secuencia de trozos: eso es
     el denominador común, hecho con el dedo.
  5. IGUALES DISFRAZADOS (2/4 y 3/6): las dos marcas caen en el mismo punto;
     comparar también puede acabar en empate.
  6. EL ENCARGO POR TELÉFONO (7/8 contra 6/7): harían falta 56 trozos y el
     cortador de la casa no hila tan fino. Se corta SOBRE EL PAPEL —los dos
     numeradores nuevos son 49 = 7·7 y 48 = 8·6— y de ahí sale, demostrada y
     no recitada, la multiplicación en cruz. El modelo se agota; la
     definición, no.

  DOS COSAS QUE NO SON DE WU
  · LA PIZARRA DE NICK. Davydov hace escribir A > B mucho antes de saber
    cuánto vale nada: la RELACIÓN entre magnitudes viene antes que el
    número. Así que cada pedido comparativo abre con la pizarra: las dos
    fracciones, un hueco en medio y tres tizas —mayor, igual, menor—. El
    alumno se moja cuando todavía no tiene NADA con que contar, y al final
    ve su propia apuesta aguantar o caer. La comparación deja de ser una
    pregunta que se contesta cuando ya está todo resuelto y pasa a ser una
    conjetura que se verifica.
  · NICK ESCUCHA EL ERROR EN VEZ DE CORREGIRLO. Una respuesta mala casi
    nunca es un despiste: suele ser una regla razonable aplicada donde no
    vale —«más numerador y más denominador, más cantidad»—. Cada opción
    falsa tiene ahora su réplica, que dice el razonamiento en voz alta y lo
    refuta con algo que el alumno YA ha vivido: quien elige 3/5 frente a
    2/3 oye que ese mismo argumento daba 1/4 > 1/3 dos pedidos atrás. Es de
    Bass y Ball: tratar lo que dice el alumno como una afirmación que
    merece ser examinada, no tachada.

  LO DEMÁS QUE CAMBIA
  · EL TIQUE YA NO SIMPLIFICA GRATIS. Antes escribía «6/8 = 3/4» sin que
    nadie hubiera grapado nada, y eso dejaba a la grapadora sin oficio. El
    nombre nuevo solo aparece cuando el gesto lo fabrica.
  · LA REGLA DE DOS PEINES. Mientras las dos pizzas están cortadas distinto,
    cada mesa dibuja sus rayas por su lado —unas desde arriba, otras desde
    abajo, cada una de su color— y las marcas caen entre púas que no casan.
    Cuando el corte común llega, los dos peines se funden en uno. Esa imagen
    ES «todavía no están en la misma secuencia».
  · EL CORTADOR AVISA. Pasar a un corte que no respeta las piezas (de cuartos
    a quintos) destruía grapas y elección sin decir nada. Ahora esos botones
    van punteados y piden un segundo toque.
  · LA GRAPADORA DE MANO EXPLICA SUS SILENCIOS. Si junto 3 octavos, la pieza
    existe pero no es 1 de nada entero: no hay división que enseñar, y ahora
    lo dice. La INDUSTRIAL, igual: con 2 sextos elegidos y la máquina de 3
    en 3 escribía 2/6 = 0,66…/2 —una división que no existe—; ahora calla,
    y cuenta que esos trozos han quedado dentro de piezas enteras.
  · ARREGLO: al volver a cortar, un trozo SUELTO elegido pasaba a tener
    elegido solo uno de sus hijos (1/4 elegido se quedaba en 1/8 tras cortar
    en 8), y la operación escrita decía otra cosa. Ahora la elección pasa a
    todos los hijos y la imagen dice lo mismo que la igualdad.
  · LA DIFERENCIA SE VE: al resolver una comparación, el hueco entre las dos
    marcas queda rayado y con su nombre (1/15). Quién gana, y por cuánto.
  · LO QUE LLEVAS, CAJA POR CAJA Y EN TOTAL. Con dos cajas abiertas el panel
    enseñaba solo la caja activa —«4/4»— mientras el cliente tenía además un
    cuarto en la otra: parecía que había respondido mal teniéndolo bien.
    Ahora se ve la cuenta entera. Y con ella, dos honestidades: el total va
    en FRACCIÓN y no en decimales —eso es otro curso—, y si las cajas están
    cortadas distinto NO se suma nada ni se pone marca en la regla: primero
    el mismo cortador. El pedido tampoco se da por bueno hasta entonces.
  · LA UNIDAD, COMO DEBE SER: el 1 es la SUPERFICIE de una pizza de la casa,
    no la pizza. La precisión no es manía: es Wu.

  LAS DOS REGLAS QUE LA HACEN HONESTA
  · La unidad está fijada y a la vista: todas las pizzas de la casa miden lo
    mismo, y una entera (su superficie) es 1.
  · Todo pedido termina en EL TIQUE, que lleva su regla. El modelo de la
    pizza no puede ser la definición de fracción —no explica 5/4 ni compara
    7/8 con 6/7—, así que se usa como situación de partida y se remata
    siempre en la recta. El pedido por teléfono es, exactamente, el momento
    en que el modelo dice hasta aquí y la recta sigue.
-->
<title>La pizzería de Nick</title>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Nunito:wght@400;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --mesa:#F4EADA; --madera:#8A5E3B; --maderaB:#9A6A42; --carton:#C89A63;
  --corteza:#C98A3E; --cortezaO:#A96C28; --queso:#F3DCA2;
  --tomate:#C4462F; --tomateO:#9E3423; --albahaca:#5C7A3E;
  --azul:#2F6E8C; --tinta:#3A2E22; --papel:#FFFDF6; --grapa:#C6CBD1;
}
*{box-sizing:border-box}
body{margin:0;background:var(--mesa);color:var(--tinta);font-family:Nunito,system-ui,sans-serif;
  background-image:radial-gradient(rgba(160,130,90,.07) 1px, transparent 1px);background-size:14px 14px}
.marco{max-width:560px;margin:0 auto;padding:0 14px 34px}

/* EL TOLDO DE LA CASA */
.toldo{margin:0 -14px 24px;padding:16px 16px 13px;position:relative;
  background:repeating-linear-gradient(90deg,#C4462F 0 26px,#F6EFE2 26px 52px);
  border-bottom:5px solid #9E3423;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toldo::after{content:'';position:absolute;left:0;right:0;bottom:-14px;height:14px;
  background:repeating-linear-gradient(90deg,#C4462F 0 26px,#F6EFE2 26px 52px);
  -webkit-mask:radial-gradient(circle 13px at 13px 0, transparent 98%, #000 100%) repeat-x;
  mask:radial-gradient(circle 13px at 13px 0, transparent 98%, #000 100%) repeat-x;
  -webkit-mask-size:26px 14px;mask-size:26px 14px}
/* Las letras blancas sobre las rayas rojas y blancas del toldo se perdían a
   trozos —fondo a rayas y texto claro es la peor pareja posible—. Ahora van
   sobre una placa oscura, como el letrero colgado de un local de verdad. */
.placa{display:inline-block;background:rgba(46,34,24,.92);border:2px solid rgba(255,255,255,.25);
  border-radius:12px;padding:9px 16px 10px;box-shadow:0 4px 10px rgba(0,0,0,.35)}
h1{font-family:'Bree Serif',serif;font-size:25px;margin:0;color:#F6EFE2;letter-spacing:.3px}
.lema{font-family:'Special Elite',monospace;font-size:10.5px;letter-spacing:1px;
  color:#E3C98F;margin-top:3px}

/* EL SERVICIO: un punto por pedido. Los redondos se SIRVEN; los rombos se
   COMPARAN. Que el propio camino diga que la casa tiene dos oficios. */
.pasos{display:flex;gap:7px;justify-content:center;align-items:center;margin:0 0 14px}
.pasos i{width:8px;height:8px;border-radius:50%;border:2px solid #D3C6AC;background:transparent;
  transition:transform .2s,background .2s}
.pasos i.vs{border-radius:2px;transform:rotate(45deg)}
.pasos i.hecho{background:var(--albahaca);border-color:var(--albahaca)}
.pasos i.actual{border-color:var(--tomate);transform:scale(1.3)}
.pasos i.vs.actual{transform:rotate(45deg) scale(1.3)}

/* LA CHARLA */
.charla{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.voz{background:var(--papel);border:1px solid #E7DCC4;border-radius:12px;padding:10px 13px 11px;
  box-shadow:0 2px 5px rgba(0,0,0,.06);font-size:15px;line-height:1.45;
  animation:llega .22s ease-out}
@keyframes llega{from{opacity:0;transform:translateY(4px)}}
@media (prefers-reduced-motion: reduce){ .voz{animation:none} }
.voz .quien{font-family:'Bree Serif',serif;font-size:12.5px;letter-spacing:.5px;margin-bottom:2px}
.voz.cliente{border-left:5px solid var(--tomate)} .voz.cliente .quien{color:var(--tomate)}
.voz.nick{border-left:5px solid var(--albahaca);background:#FBF9EF;position:relative;padding-left:74px;min-height:78px}
.voz.nick .quien{color:var(--albahaca)}
.cara-caja{position:absolute;left:8px;top:8px;width:56px}
.cara-caja svg{width:56px;height:auto;display:block}
@media (max-width:380px){ .voz.nick{padding-left:62px} .cara-caja{width:46px} .cara-caja svg{width:46px} }
/* Nick tiene dos bocas: la del oficio y la de cuando el pedido sale redondo. */
.cara-caja .boca-f{display:none}
.voz.nick.feliz .boca{display:none}
.voz.nick.feliz .boca-f{display:block}
.pista{font-family:'Special Elite',monospace;font-size:11.5px;color:#9A8A70;letter-spacing:.5px;
  padding-left:4px}

/* LA MESA Y LAS CAJAS */
.mesa{background:repeating-linear-gradient(94deg,var(--maderaB) 0 30px,var(--madera) 30px 60px);
  border-radius:16px;padding:12px;box-shadow:inset 0 0 0 4px #6E4A2E, 0 4px 10px rgba(0,0,0,.15);
  display:flex;gap:10px;justify-content:center;align-items:flex-start}
.caja{flex:1;max-width:252px;background:var(--carton);border-radius:10px;padding:7px;
  box-shadow:inset 0 0 0 2px #A87C48, 0 3px 6px rgba(0,0,0,.25);cursor:pointer;transition:box-shadow .15s}
.caja.activa{box-shadow:inset 0 0 0 3px #F3DCA2, 0 0 0 3px var(--tomate), 0 4px 10px rgba(0,0,0,.3)}
.caja .tapa{font-family:'Special Elite',monospace;font-size:9.5px;letter-spacing:1px;color:#6E4A2E;
  text-align:center;margin-bottom:3px}
/* En las comparaciones cada caja es de una mesa, y lo lleva puesto: una
   cinta del color de su marca en la regla. Caja, mesa y marca, atadas. */
.caja.mA{border-top:5px solid var(--tomate)} .caja.mA .tapa{color:var(--tomateO)}
.caja.mB{border-top:5px solid var(--azul)}  .caja.mB .tapa{color:var(--azul)}
/* el resalte de «caja activa» debe ser del color de SU mesa: si no, la caja
   de la mesa 7 se resalta en rojo y el vínculo caja↔mesa↔marca se rompe */
.caja.mB.activa{box-shadow:inset 0 0 0 3px #F3DCA2, 0 0 0 3px var(--azul), 0 4px 10px rgba(0,0,0,.3)}
svg.pizza{display:block;width:100%;height:auto;touch-action:manipulation}
.corte{cursor:pointer;transition:transform .14s ease-out}
/* Antes, elegir un trozo solo cambiaba el color del borde, y con esta paleta
   —todo tostado— apenas se notaba. Ahora la porción elegida SE SEPARA de la
   pizza, como cuando la levantas de la caja, y las demás se apagan un poco.
   El gesto se ve de un vistazo desde el fondo del aula. */
.corte.apagada{opacity:.55}
.corte.elegida{filter:drop-shadow(0 4px 5px rgba(60,40,20,.45))}
/* Las grapas se ven y se van, EN ESTE ORDEN: primero el corte y las grapas
   juntos —así se entiende qué se une—, luego se va el corte, y al final las
   grapas, que dejan la porción limpia. Y solo brillan las juntas NUEVAS. */
.grapa-nueva{animation:seva 2.6s ease-out forwards;transform-box:view-box}
.costura-nueva{animation:seCose 2.6s ease-out forwards}
@keyframes seva{0%{opacity:0;transform:scale(1.7)}8%{opacity:1;transform:scale(1)}82%{opacity:1}100%{opacity:0}}
@keyframes seCose{0%{opacity:0}8%{opacity:.85}48%{opacity:.85}66%{opacity:0}100%{opacity:0}}

/* LO QUE HA PASADO: la operación escrita como en el cuaderno. Cortar en c
   multiplica arriba y abajo por c; grapar de c en c los divide. Las flechas
   son las mismas que se dibujan en la pizarra, y ahora salen solas cuando el
   alumno hace el gesto en la pizza: primero el gesto, después el símbolo. */
.opera{background:var(--papel);border:1px solid #E7DCC4;border-radius:12px;margin-top:12px;
  padding:8px 10px 4px;box-shadow:0 2px 5px rgba(0,0,0,.06)}
.opera .rot{font-family:'Special Elite',monospace;font-size:10.5px;letter-spacing:2px;
  color:#9A8A70;text-align:center;margin-bottom:2px}
.opera svg{display:block;width:100%;max-width:330px;margin:0 auto;height:auto}
.opera .frase{font-size:12.5px;color:#7A6A52;text-align:center;margin:2px 0 4px}

/* MANDOS */
.fila{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:12px 0 0}
.etq{font-size:11.5px;letter-spacing:1.2px;text-transform:uppercase;color:#9A8A70;font-weight:700}
button.b{font-family:Nunito,sans-serif;font-weight:700;font-size:14px;padding:9px 13px;border-radius:10px;
  border:1px solid #DCCFB4;background:var(--papel);color:var(--tinta);cursor:pointer;box-shadow:0 2px 0 #DCCFB4}
button.b:active{transform:translateY(1px);box-shadow:0 1px 0 #DCCFB4}
button.b[aria-pressed="true"]{background:var(--tomate);color:#fff;border-color:var(--tomateO);
  box-shadow:0 2px 0 var(--tomateO)}
button.b.acc{background:var(--tomate);color:#fff;border-color:var(--tomateO);box-shadow:0 2px 0 var(--tomateO)}
button.b.verde{background:var(--albahaca);color:#fff;border-color:#46602F;box-shadow:0 2px 0 #46602F}
/* Los cortes que NO respetan las piezas van punteados, como lo que está por
   coser: se puede, pero se pierde lo grapado. El primer toque avisa; el
   segundo, corta. */
button.b.rompe{border-style:dashed;border-color:#C98F7B;color:#9E3423;background:#FFF8F2;
  box-shadow:0 2px 0 #E9C9BB}
button.b.avisa{background:#C87A28;color:#fff;border-color:#9A5C1B;border-style:solid;
  box-shadow:0 2px 0 #9A5C1B;animation:tiembla .28s}
@keyframes tiembla{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}

/* LA PIZARRA DE NICK. Antes de cortar nada, el signo. Que el alumno se moje
   cuando todavía no puede contar: eso convierte la comparación en una
   conjetura que se verifica —y da valor al fallo, porque se ve caer la
   propia apuesta— en vez de una pregunta que se contesta cuando ya está
   todo resuelto y no queda nada que pensar. */
.pizarra{margin-top:12px;background:#2E4034;border:7px solid #6E4A2E;border-radius:8px;
  padding:11px 12px 13px;box-shadow:inset 0 0 26px rgba(0,0,0,.45), 0 3px 8px rgba(0,0,0,.2);
  text-align:center}
.pizarra .rot{font-family:'Special Elite',monospace;font-size:10px;letter-spacing:2px;
  color:#8FA894;margin-bottom:7px}
.pizarra .linea{font-family:'Bree Serif',serif;font-size:21px;color:#EFF3EA;
  display:flex;gap:11px;align-items:center;justify-content:center;flex-wrap:wrap}
.pizarra .hueco-signo{display:inline-block;min-width:44px;padding:1px 8px;border-radius:5px;
  border:2px dashed #7E9686;color:#8FA894}
.pizarra .signo{display:inline-block;min-width:44px;font-size:26px;color:#F7E9A0}
.pizarra .apuesta{font-family:'Special Elite',monospace;font-size:10.5px;letter-spacing:1px;
  color:#8FA894;margin-top:7px}
.pizarra .fA{color:#F0A79A} .pizarra .fB{color:#9FD0E6}
.pizarra .bots{display:flex;gap:8px;justify-content:center;margin-top:10px}
.pizarra .bots button{font-family:'Bree Serif',serif;font-size:20px;width:52px;padding:5px 0;
  border-radius:8px;border:2px solid #7E9686;background:rgba(255,255,255,.07);color:#EFF3EA;
  cursor:pointer}
.pizarra .bots button:active{background:rgba(255,255,255,.2)}

/* EL TIQUE */
.tique{background:var(--papel);padding:14px 15px 16px;margin-top:16px;box-shadow:0 3px 9px rgba(0,0,0,.10);
  -webkit-mask:radial-gradient(circle 6px at 6px 0, transparent 98%, #000 100%) repeat-x top / 12px 6px,
        radial-gradient(circle 6px at 6px 6px, transparent 98%, #000 100%) repeat-x bottom / 12px 6px,
        linear-gradient(#000,#000) no-repeat center / 100% calc(100% - 12px);
  mask:radial-gradient(circle 6px at 6px 0, transparent 98%, #000 100%) repeat-x top / 12px 6px,
        radial-gradient(circle 6px at 6px 6px, transparent 98%, #000 100%) repeat-x bottom / 12px 6px,
        linear-gradient(#000,#000) no-repeat center / 100% calc(100% - 12px)}
.tique h2{font-family:'Special Elite',monospace;font-size:12.5px;margin:0 0 9px;letter-spacing:3px;
  color:#9A8A70;text-align:center}
.lectura{font-size:15.5px;margin:0 0 3px;text-align:center}
.lectura b{font-family:'Bree Serif',serif;font-size:22px;color:var(--tomate)}
.desglose{font-size:12.5px;color:#9A8A70;text-align:center;margin:0 0 8px;min-height:18px}
.regla{position:relative;height:60px;margin-top:4px}
.cinta{position:absolute;left:0;right:0;top:20px;height:24px;border-radius:2px;
  background:linear-gradient(180deg,#F3EAD3,#E4D8B8);border:1px solid #C9BB9E}
.cinta b{position:absolute;top:26px;font-size:11px;color:#6E6250;transform:translateX(-50%);font-weight:700}
.marca{position:absolute;top:0;transform:translateX(-50%);text-align:center;pointer-events:none}
.marca em{display:block;width:3px;height:42px;margin:0 auto;background:var(--tomate);border-radius:2px}
.marca u{display:block;font-family:'Bree Serif',serif;font-size:12.5px;color:var(--tomate);text-decoration:none}
.marca.dos em{background:var(--azul)} .marca.dos u{color:var(--azul)}
/* EL HUECO: al resolver una comparación, lo que separa a las dos marcas se
   raya y se nombra. No solo quién gana: por cuánto. */
.hueco{position:absolute;top:0;height:24px;
  background:repeating-linear-gradient(45deg,rgba(196,70,47,.30) 0 4px,rgba(196,70,47,.07) 4px 8px)}
.hueco span{position:absolute;left:50%;top:-17px;transform:translateX(-50%);
  font-family:'Bree Serif',serif;font-size:11px;color:var(--tomateO);background:var(--papel);
  padding:0 5px;border-radius:7px;border:1px solid #E7DCC4;white-space:nowrap}
.nota{font-size:12px;color:#9A8A70;margin:12px 0 0;line-height:1.5;text-align:center}
</style></head><body>
<div class="marco">
  <div class="toldo">
    <div class="placa">
      <h1>La pizzería de Nick</h1>
      <div class="lema">TODAS LAS PIZZAS DE LA CASA MIDEN LO MISMO · UNA ENTERA = 1</div>
    </div>
  </div>

  <div class="pasos" id="pasos"></div>
  <div class="charla" id="charla"></div>
  <div class="mesa" id="mesa"></div>

  <div id="opera"></div>
  <div id="pizarra"></div>

  <div class="fila" id="filaCortes"><span class="etq">cortar en</span><span id="botCortes"></span></div>
  <div class="fila" id="filaInd">
    <span class="etq">grapar toda la pizza</span><span id="botIndustrial"></span>
  </div>
  <div class="fila" id="filaBotones">
    <button class="b acc" id="bGrapar">Grapar lo elegido</button>
    <button class="b" id="bSoltar">Quitar grapas</button>
    <button class="b" id="bLimpiar">Empezar de nuevo</button>
  </div>
  <div class="fila" id="filaResp"></div>

  <div class="tique">
    <h2>TIQUE</h2>
    <p class="lectura" id="lec">—</p>
    <p class="desglose" id="desglose"></p>
    <div class="regla"><div class="cinta" id="cinta"></div><div id="marcas"></div></div>
    <p class="nota">El 1 es la superficie de una pizza entera de la casa.<br>La pizza es el envase; el número vive en la regla.</p>
  </div>
</div>

<script>
const NS = 'http://www.w3.org/2000/svg';
const NICK = `<svg viewBox="0 0 78 96" class="cara"><!-- NICK, EL PIZZERO. Antes era un
  monigote de frente, todo simetría: no decía nada. Ahora está EN ESCENA —de
  tres cuartos, con la grapadora en alto y la otra mano en la cadera—, y lleva
  lo que lleva un pizzero de verdad: gorro ladeado, bigote de manillar, cejas
  espesas, delantal con la harina del día y el paño al hombro. Los volúmenes
  van con dos tonos, como los edificios de la ciudad. -->
  <ellipse cx="39" cy="92" rx="26" ry="3.6" fill="rgba(60,40,20,.22)"/>

  <!-- cuerpo, de tres cuartos -->

/* ── PIEZAS ─────────────────────────────────────────────────────────── */
function grupos(c){
  const n = c.cortes, g = [], usados = new Array(n).fill(false);
  for(let i = 0; i < n; i++){
    if(usados[i] || (c.grapas[(i - 1 + n) % n] && n > 1)) continue;
    const t = [i]; usados[i] = true;
    let j = i;
    while(c.grapas[j] && t.length < n){ j = (j + 1) % n; if(usados[j]) break; t.push(j); usados[j] = true; }
    g.push(t);
  }
  if(!g.length) g.push([...Array(n).keys()]);
  return g;
}
/* EL TIQUE YA NO SIMPLIFICA GRATIS. Antes esta función devolvía
   «6/8 = 3/4» ella sola, con su máximo común divisor de tapadillo, y así la
   grapadora no tenía nada que enseñar. Ahora cada fracción se llama como
   está cortada; el nombre nuevo lo fabrica el gesto, y lo enseña la
   operación escrita, no el tique por su cuenta. */
const nombre = (k, b) => k + '/' + b;
const corto = nombre;
const trozosDe = c => Math.round(valor(c) * c.cortes);
function valor(c){
  return grupos(c).filter(t => c.sel.has(t[0])).reduce((s, t) => s + t.length, 0) / c.cortes;
}

/* ── VOLVER A CORTAR SIN PERDER LO GRAPADO ───────────────────────────
   El cortador pasa por toda la pizza, pero lo grapado AGUANTA: las juntas
   nuevas que caen dentro de una pieza ya unida nacen grapadas. Así media
   pizza sigue siendo la misma pieza y solo cambia de nombre: 1/2 → 4/8.
   Si el corte nuevo no es múltiplo del viejo (de cuartos a tercios), no hay
   manera de respetar las piezas y se empieza de cero.                    */
function recorta(c, nuevo){
  const b = c.cortes;
  if(nuevo === b) return;
  /* lo que se enseñará escrito: si hay algo elegido, se usa esa fracción;
     si no, la fracción unidad, que es la que mejor se ve */
  if(nuevo % b === 0){
    const ka = trozosDe(c) || 1, f = nuevo / b;
    ultimaOp = {tipo:'corte', c: f, ka, ba: b, kd: ka * f, bd: nuevo};
  }else ultimaOp = null;
  if(nuevo % b === 0){
    const f = nuevo / b, g2 = new Array(nuevo).fill(false), gv = grupos(c);
    /* El cortador pasa por TODA la pizza, pero cada pieza reacciona distinto:
       · una pieza GRAPADA aguanta entera —las juntas nuevas de su interior
         nacen unidas—, así que solo cambia de nombre: 1/2 pasa a 4/8;
       · un trozo suelto SÍ se parte: un cuarto sin grapar se convierte en dos
         octavos de verdad, separados.
       Sin esa diferencia no habría octavos sueltos que coger, y el pedido de
       tres octavos sería imposible. */
    gv.forEach(t => {
      const unida = t.length > 1;
      t.forEach((i, idx) => {
        for(let k = 0; k < f - 1; k++) g2[i*f + k] = unida;
        if(idx < t.length - 1) g2[i*f + f - 1] = true;     // junta interna del grupo
      });
    });
    /* LA ELECCIÓN TAMBIÉN SE HEREDA ENTERA. Un trozo suelto elegido se parte
       en f hijos: los f quedan elegidos —antes solo se quedaba el primero, y
       1/4 elegido amanecía como 1/8 mientras la operación juraba que era
       2/8—. Una pieza grapada elegida sigue siendo una pieza: basta su
       cabeza. Así la imagen y la igualdad dicen siempre lo mismo. */
    const sel2 = new Set();
    gv.forEach(t => {
      if(!c.sel.has(t[0])) return;
      if(t.length > 1) sel2.add(t[0] * f);
      else for(let k = 0; k < f; k++) sel2.add(t[0]*f + k);
    });
    c.grapas = g2; c.sel = sel2;
    /* Si el cliente no tenía nada elegido, la operación hablaba de un trozo
       que no se veía por ninguna parte: los números salían de la nada. Ahora
       queda MARCADO el trozo del que habla —el primero—, para que la imagen
       y la igualdad digan lo mismo. */
    if(!sel2.size) for(let k = 0; k < f; k++) c.sel.add(k);
  }else{
    c.grapas = new Array(nuevo).fill(false); c.sel.clear();
  }
  c.cortes = nuevo; c.recien.clear();
}

/* ── DIBUJO ─────────────────────────────────────────────────────────── */
function sector(cx, cy, r, a0, a1){
  const rad = a => (a - 90) * Math.PI / 180;
  if(a1 - a0 >= 359.9) return `M${cx-r} ${cy} a${r} ${r} 0 1 0 ${2*r} 0 a${r} ${r} 0 1 0 ${-2*r} 0 Z`;
  const x0 = cx + r*Math.cos(rad(a0)), y0 = cy + r*Math.sin(rad(a0));
  const x1 = cx + r*Math.cos(rad(a1)), y1 = cy + r*Math.sin(rad(a1));
  return `M${cx} ${cy} L${x0.toFixed(1)} ${y0.toFixed(1)} A${r} ${r} 0 ${(a1-a0)>180?1:0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)} Z`;
}
function dibujaPizza(c, idx){
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 300 300'); svg.setAttribute('class', 'pizza');
  const cx = 150, cy = 148, R = 126, paso = 360 / c.cortes;
  /* A quince cortes el trozo tiene 24 grados: los huecos fijos de antes se
     comían el queso y cuatro ingredientes por trozo eran una avalancha.
     Ahora huecos e ingredientes van A ESCALA del trozo. */
  const gC = Math.min(.9, paso * .03), gQ = Math.min(2.6, paso * .09);
  const esc = Math.max(.55, Math.min(1, paso / 70));
  const nTop = paso >= 70 ? 4 : paso >= 40 ? 3 : paso >= 26 ? 2 : 1;
  const som = document.createElementNS(NS, 'ellipse');
  som.setAttribute('cx', cx); som.setAttribute('cy', cy + R + 8);
  som.setAttribute('rx', R*.86); som.setAttribute('ry', 8);
  som.setAttribute('fill', 'rgba(60,40,20,.25)'); svg.appendChild(som);

  grupos(c).forEach(t => {
    const a0 = t[0]*paso, a1 = a0 + t.length*paso, ele = c.sel.has(t[0]);
    const g = document.createElementNS(NS, 'g');
    g.setAttribute('class', 'corte' + (ele ? ' elegida' : (c.sel.size ? ' apagada' : '')));
    if(ele){                       // se separa siguiendo su propia bisectriz
      const bis = ((a0 + a1) / 2 - 90) * Math.PI / 180;
      g.setAttribute('transform', `translate(${(10*Math.cos(bis)).toFixed(1)} ${(10*Math.sin(bis)).toFixed(1)})`);
    }
    const cor = document.createElementNS(NS, 'path');           // corteza
    cor.setAttribute('d', sector(cx, cy, R, a0 + gC, a1 - gC));
    cor.setAttribute('fill', 'var(--corteza)');
    cor.setAttribute('stroke', ele ? '#FFF3D0' : 'var(--cortezaO)');
    cor.setAttribute('stroke-width', ele ? 6 : 2.5); cor.setAttribute('stroke-linejoin', 'round');
    g.appendChild(cor);
    const que = document.createElementNS(NS, 'path');            // queso
    que.setAttribute('d', sector(cx, cy, R - 13, a0 + gQ, a1 - gQ));
    que.setAttribute('fill', 'var(--queso)'); g.appendChild(que);

    for(let k = 0; k < t.length; k++){
      const a = (t[0] + k + .5) * paso - 90;
      [[.60, 9.5, 1], [.80, 6, 0], [.36, 7, 1], [.72, 5, 0]].slice(0, nTop)
      .forEach(([d, rr, esTomate], q) => {
        const ang = (a + (q - (nTop - 1)/2) * Math.min(9, paso/3.2)) * Math.PI / 180;
        const px = cx + (R-15)*d*Math.cos(ang), py = cy + (R-15)*d*Math.sin(ang);
        if(esTomate){
          const s = document.createElementNS(NS, 'circle');
          s.setAttribute('cx', px); s.setAttribute('cy', py + 1.4); s.setAttribute('r', rr*esc);
          s.setAttribute('fill', 'var(--tomateO)'); s.setAttribute('opacity', .5); g.appendChild(s);
          const p = document.createElementNS(NS, 'circle');
          p.setAttribute('cx', px); p.setAttribute('cy', py); p.setAttribute('r', rr*esc);
          p.setAttribute('fill', 'var(--tomate)'); g.appendChild(p);
        }else{
          const h = document.createElementNS(NS, 'ellipse');
          h.setAttribute('cx', px); h.setAttribute('cy', py);
          h.setAttribute('rx', rr*1.5*esc); h.setAttribute('ry', rr*.85*esc);
          h.setAttribute('fill', 'var(--albahaca)');
          h.setAttribute('transform', `rotate(${a + 40} ${px} ${py})`); g.appendChild(h);
        }
      });
    }
    for(let k = 0; k < t.length - 1; k++){        // grapas, solo las nuevas
      if(!c.recien.has(t[k])) continue;
      const gr = (t[k] + 1) * paso, a = (gr - 90) * Math.PI / 180;
      const cos = document.createElementNS(NS, 'path');
      cos.setAttribute('d', `M${cx} ${cy} L${(cx + R*Math.cos(a)).toFixed(1)} ${(cy + R*Math.sin(a)).toFixed(1)}`);
      cos.setAttribute('stroke', 'var(--cortezaO)'); cos.setAttribute('stroke-width', 2.6);
      cos.setAttribute('stroke-dasharray', '7 6'); cos.setAttribute('class', 'costura-nueva');
      g.appendChild(cos);
      [[.38, 1], [.72, -1]].forEach(([d, lado], q) => {
        const px = cx + R*d*Math.cos(a), py = cy + R*d*Math.sin(a);
        const fuera = document.createElementNS(NS, 'g');   // capa que coloca
        fuera.setAttribute('transform', `translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${gr + (q?8:-8)})`);
        const dentro = document.createElementNS(NS, 'g');  // capa que anima
        dentro.setAttribute('class', 'grapa-nueva');
        const forma = `M-12 ${6.5*lado} L-12 0 L12 0 L12 ${6.5*lado}`;
        [['rgba(60,45,30,.35)', 7.2, 'translate(1 1.6)'], ['var(--grapa)', 5.2, null]].forEach(([col, gw, tr]) => {
          const p = document.createElementNS(NS, 'path');
          p.setAttribute('d', forma); p.setAttribute('fill', 'none'); p.setAttribute('stroke', col);
          p.setAttribute('stroke-width', gw); p.setAttribute('stroke-linecap', 'round');
          p.setAttribute('stroke-linejoin', 'round'); if(tr) p.setAttribute('transform', tr);
          dentro.appendChild(p);
        });
        const bri = document.createElementNS(NS, 'path');
        bri.setAttribute('d', 'M-11 -1.5 L11 -1.5'); bri.setAttribute('fill', 'none');
        bri.setAttribute('stroke', '#EDF1F4'); bri.setAttribute('stroke-width', 1.4);
        bri.setAttribute('stroke-linecap', 'round'); dentro.appendChild(bri);
        fuera.appendChild(dentro); g.appendChild(fuera);
      });
    }
    g.addEventListener('click', ev => {
      ev.stopPropagation(); activa = idx;
      if(c.sel.has(t[0])) c.sel.delete(t[0]); else c.sel.add(t[0]);
      ultimaOp = null;            // al cambiar lo elegido, la operación vieja ya no describe esto
      pinta(); lee();
    });
    svg.appendChild(g);
  });
  return svg;
}
function pinta(){
  const p = PEDIDOS[pedido];
  const mesa = document.getElementById('mesa'); mesa.innerHTML = '';
  if(!cajas.length) return;                         // el teléfono no trae cajas
  cajas.forEach((c, i) => {
    const caja = document.createElement('div');
    caja.className = 'caja' + (i === activa && cajas.length > 1 ? ' activa' : '')
                   + (p.compara ? (i ? ' mB' : ' mA') : '');
    const tapa = document.createElement('div');
    tapa.className = 'tapa';
    tapa.textContent = (p.compara ? p.mesas[i] : 'CAJA ' + (i+1)) + ' · EN ' + c.cortes;
    caja.appendChild(tapa); caja.appendChild(dibujaPizza(c, i));
    caja.addEventListener('click', () => { activa = i; pinta(); lee(); });
    mesa.appendChild(caja);
  });
  /* LA GRAPADORA INDUSTRIAL. Pasa por la pizza ENTERA uniendo de c en c, y
     es la operación exactamente inversa al cortador: cortar en c multiplica
     arriba y abajo por c; grapar de c en c los divide. Con la grapadora de
     mano solo cambia MI trozo —la pizza sigue partida igual—; con esta
     cambia el denominador de verdad, porque cambia en cuántas partes está
     la pizza. */
  const ind = document.getElementById('botIndustrial'); ind.innerHTML = '';
  const cc = cajas[activa].cortes;
  [2,3,4,5].filter(x => cc % x === 0 && cc / x >= 1).forEach(x => {
    const b = document.createElement('button');
    b.className = 'b'; b.textContent = 'de ' + x + ' en ' + x;
    b.addEventListener('click', () => {
      const c = cajas[activa];
      /* qué trozos tenía elegidos ANTES, en unidades finas: así, después de
         grapar, se vuelven a marcar las piezas que los contienen y la imagen
         sigue diciendo lo mismo que la operación */
      const finos = grupos(c).filter(g => c.sel.has(g[0])).flat();
      const kAntes = finos.length, bAntes = c.cortes, vAntes = valor(c);
      c.recien.clear();
      c.grapas = new Array(c.cortes).fill(false);
      for(let i = 0; i < c.cortes; i++)
        if((i + 1) % x !== 0){ c.grapas[i] = true; c.recien.add(i); }
      c.sel.clear();
      if(kAntes) grupos(c).forEach(g => { if(g.some(i => finos.includes(i))) c.sel.add(g[0]); });
      else c.sel.add(0);                       // sin nada elegido, se marca la primera pieza
      /* LA MÁQUINA GRANDE TAMBIÉN SABE CALLARSE. La división escrita solo es
         verdad si x cabe en el numerador Y los trozos elegidos llenaban
         piezas enteras. Con 2 sextos y la máquina de 3 en 3 no hay tal
         división —2 entre 3 no da un numerador— y además los 2 sextos caen
         DENTRO de una pieza de 3 que ahora va entera: la cantidad cambia.
         Escribir 2/6 = 0,66…/2 sería mentir con flechas; mejor decir qué ha
         pasado de verdad. */
      let notaIndustrial = null;
      const vDespues = valor(c);
      if(!kAntes)
        ultimaOp = {tipo:'grapa', c: x, ka: x, ba: bAntes, kd: 1, bd: bAntes / x};
      else if(kAntes % x === 0 && casi(vAntes, vDespues))
        ultimaOp = {tipo:'grapa', c: x, ka: kAntes, ba: bAntes, kd: kAntes / x, bd: bAntes / x};
      else{
        ultimaOp = null;
        notaIndustrial = 'La máquina grande une la pizza ENTERA de ' + x + ' en ' + x
          + ': tus ' + kAntes + '/' + bAntes + ' no llenaban piezas enteras, así que '
          + 'te llevas las piezas que los contienen. Aquí no hay división que enseñar.';
      }
      pinta(); lee();
      if(notaIndustrial) document.getElementById('desglose').innerHTML = notaIndustrial;
      clearTimeout(monta.reloj);
      monta.reloj = setTimeout(() => { cajas.forEach(z => z.recien.clear()); pinta(); }, 2600);
    });
    ind.appendChild(b);
  });
  /* LA CARTA DE CORTES. Cada pedido trae la suya —en la comparación de
     tercios contra quintos aparecen el 6, el 10 y el 15, para que el alumno
     DESCUBRA que solo uno vale para las dos—. Los cortes que no respetan
     las piezas van punteados y piden un segundo toque. */
  const cont = document.getElementById('botCortes'); cont.innerHTML = '';
  (p.menu || [2,3,4,5,6,8]).forEach(n => {
    const c = cajas[activa];
    /* el punteado solo cuando de verdad hay algo que perder: sobre una caja
       intacta, cualquier corte es inocente */
    const enJuego = c.sel.size > 0 || c.grapas.some(Boolean);
    const rompe = n % c.cortes !== 0 && enJuego;
    const avisado = armado && armado.caja === activa && armado.n === n;
    const b = document.createElement('button');
    b.className = 'b' + (rompe && n !== c.cortes ? ' rompe' : '') + (avisado ? ' avisa' : '');
    b.textContent = n;
    b.setAttribute('aria-pressed', String(c.cortes === n));
    b.addEventListener('click', () => {
      const cj = cajas[activa];
      if(n === cj.cortes) return;
      const destruye = n % cj.cortes !== 0 && (cj.sel.size > 0 || cj.grapas.some(Boolean));
      if(destruye && !(armado && armado.caja === activa && armado.n === n)){
        armado = {caja: activa, n};
        clearTimeout(pinta.aviso);
        pinta.aviso = setTimeout(() => { armado = null; pinta(); }, 3200);
        pinta();
        document.getElementById('desglose').innerHTML =
          'De ' + cj.cortes + ' a ' + n + ' el cortador <b>no respeta las piezas</b>: se '
          + 'pierde lo grapado y lo elegido. Toca otra vez para cortar de cero.';
        return;
      }
      armado = null;
      recorta(cj, n); pinta(); lee();
    });
    cont.appendChild(b);
  });
}

/* ── LA OPERACIÓN, DIBUJADA ──────────────────────────────────────────
   Se guarda el ANTES y el DESPUÉS de la fracción y se pinta la igualdad con
   sus dos flechas —la de arriba para el numerador, la de abajo para el
   denominador— y el mismo número en las dos, que es justo lo que hace el
   gesto: cortar multiplica los dos; grapar de c en c divide los dos.      */
let ultimaOp = null;
/* LA PUNTA DE FLECHA. Se calcula con la TANGENTE de la curva en su final
   —no a ojo—: si no, la cabeza sale torcida o mirando a otro lado. */
function punta(x1, y1, cx, cy, col, largo = 13){
  const tx = x1 - cx, ty = y1 - cy, L = Math.hypot(tx, ty);
  const ux = tx / L, uy = ty / L, ang = 24 * Math.PI / 180;
  const P = s => [
    (x1 - largo * (ux * Math.cos(s*ang) - uy * Math.sin(s*ang))).toFixed(1),
    (y1 - largo * (ux * Math.sin(s*ang) + uy * Math.cos(s*ang))).toFixed(1)];
  const [ax, ay] = P(1), [bx, by] = P(-1);
  return `<path d="M${x1} ${y1} L${ax} ${ay} L${bx} ${by} Z" fill="${col}"/>`;
}
/* EL CARA A CARA. Cuando las dos mesas están servidas y las pizzas cortadas
   IGUAL, la operación deja paso a la comparación en limpio: dos numeradores
   grandes sobre el mismo denominador. Misma secuencia: gana el que va más
   lejos. Si van igual de lejos, empate con dos nombres.                  */
function caraACara(kA, kB, b){
  return `<div class="opera">
    <div class="rot">MISMOS TROZOS · SE PUEDE COMPARAR</div>
    <svg viewBox="0 0 300 122">
      <g font-family="'Bree Serif',serif" text-anchor="middle">
        <text x="88"  y="52" font-size="38" fill="var(--tomate)">${kA}</text>
        <text x="212" y="52" font-size="38" fill="var(--azul)">${kB}</text>
        <text x="88"  y="102" font-size="22" fill="var(--tinta)">${b}</text>
        <text x="212" y="102" font-size="22" fill="var(--tinta)">${b}</text>
      </g>
      <text x="150" y="68" text-anchor="middle" font-family="'Special Elite',monospace"
            font-size="9" letter-spacing="2" fill="#9A8A70">FRENTE A</text>
      <path d="M62 64 H114" stroke="var(--tinta)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M186 64 H238" stroke="var(--tinta)" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <div class="frase">${kA === kB
      ? 'Mismo numerador también: el MISMO punto con dos nombres.'
      : 'Misma secuencia de ' + b + ': gana el numerador mayor.'}</div>
  </div>`;
}
/* EL CORTE SOBRE EL PAPEL. Las dos fracciones del teléfono, puestas en la
   misma secuencia de 56: cada una multiplicada arriba y abajo por el
   denominador DE LA OTRA. Al resolver, se destapa lo que son los
   numeradores nuevos: los productos en cruz.                             */
function papelPanel(){
  const p = PEDIDOS[pedido];
  if(!papel) return `<div class="opera">
    <div class="rot">ENCARGO POR TELÉFONO</div>
    <svg viewBox="0 0 300 122">
      <g font-family="'Bree Serif',serif" text-anchor="middle">
        <text x="88"  y="52" font-size="34" fill="var(--tomate)">${p.fA[0]}</text>
        <text x="212" y="52" font-size="34" fill="var(--azul)">${p.fB[0]}</text>
        <text x="88"  y="102" font-size="24" fill="var(--tinta)">${p.fA[1]}</text>
        <text x="212" y="102" font-size="24" fill="var(--tinta)">${p.fB[1]}</text>
      </g>
      <text x="150" y="68" text-anchor="middle" font-family="'Special Elite',monospace"
            font-size="9" letter-spacing="2" fill="#9A8A70">FRENTE A</text>
      <path d="M64 64 H112" stroke="var(--tinta)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M188 64 H236" stroke="var(--tinta)" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <div class="frase">Octavos contra séptimos: harían falta 56 trozos. Se corta sobre el papel.</div>
  </div>`;
  const fila = (y, k, b, K, B, f, col, anota) => `
    <g font-family="'Bree Serif',serif" text-anchor="middle" font-size="26" fill="var(--tinta)">
      <text x="58" y="${y}">${k}</text><text x="58" y="${y+36}">${b}</text>
      <text x="118" y="${y+18}">=</text>
      <text x="182" y="${y}">${K}</text><text x="182" y="${y+36}">${B}</text>
    </g>
    <path d="M42 ${y+10} H74"   stroke="var(--tinta)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M160 ${y+10} H204" stroke="var(--tinta)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M74 ${y-20} Q120 ${y-40} ${162} ${y-22}" fill="none" stroke="${col}"
          stroke-width="2.6" stroke-linecap="round"/>
    ${punta(166, y-21, 120, y-40, col, 10)}
    <text x="120" y="${y-32}" text-anchor="middle" font-family="'Bree Serif',serif"
          font-size="15" fill="${col}">·${f}</text>
    ${resuelto ? `<text x="214" y="${y}" text-anchor="start" font-family="'Special Elite',monospace"
          font-size="11.5" fill="#9A8A70">= ${anota}</text>` : ''}`;
  return `<div class="opera">
    <div class="rot">CORTADO SOBRE EL PAPEL · ARRIBA Y ABAJO</div>
    <svg viewBox="0 0 300 218">
      ${fila(58,  p.fA[0], p.fA[1], p.fA[0]*p.fB[1], p.fA[1]*p.fB[1], p.fB[1], 'var(--tomate)', p.fA[0]+'×'+p.fB[1])}
      ${fila(162, p.fB[0], p.fB[1], p.fB[0]*p.fA[1], p.fB[1]*p.fA[1], p.fA[1], 'var(--azul)',   p.fB[0]+'×'+p.fA[1])}
    </svg>
    <div class="frase">${resuelto
      ? 'Los números comparados —49 y 48— son los productos EN CRUZ: la regla de multiplicar en cruz es exactamente este corte sobre el papel.'
      : 'Ya están en la misma secuencia de 56: ahora sí se comparan.'}</div>
  </div>`;
}
/* LO QUE LLEVAS, CAJA POR CAJA Y EN TOTAL. Con dos cajas abiertas, el panel
   enseñaba solo la caja activa —«4/4»— mientras el cliente tenía además un
   cuarto en la otra: parecía que el pedido estaba mal cuando estaba bien.
   Ahora se ve la cuenta entera, y con dos avisos de honestidad:
   · el total se escribe en FRACCIÓN, no en decimales: aquí todavía no toca;
   · si las dos cajas están cortadas distinto, NO se suma nada. Trozos
     distintos no se juntan: primero el mismo cortador. Es el mismo
     argumento que en la comparación, y sale de la propia mesa. */
function panelMesa(){
  const ks = cajas.map(trozosDe), bs = cajas.map(c => c.cortes);
  if(!ks.some(k => k > 0)) return '';
  const mismo = bs.every(b => b === bs[0]);
  const stack = (x, k, b, col) => `
    <text x="${x}" y="40" font-size="26" fill="${col || 'var(--tinta)'}">${k}</text>
    <text x="${x}" y="82" font-size="26" fill="${col || 'var(--tinta)'}">${b}</text>
    <path d="M${x-19} 52 H${x+19}" stroke="${col || 'var(--tinta)'}" stroke-width="2.4" stroke-linecap="round"/>`;
  const total = ks.reduce((s, k) => s + k, 0);
  return `<div class="opera">
    <div class="rot">LLEVAS EN LA MESA</div>
    <svg viewBox="0 0 300 100">
      <g font-family="'Bree Serif',serif" text-anchor="middle">
        ${stack(46, ks[0], bs[0])}
        <text x="98" y="62" font-size="24" fill="#9A8A70">+</text>
        ${stack(150, ks[1], bs[1])}
        <text x="202" y="62" font-size="24" fill="#9A8A70">${mismo ? '=' : '?'}</text>
        ${mismo ? stack(254, total, bs[0], 'var(--tomate)')
                : `<text x="254" y="68" font-size="30" fill="#C3B49A">—</text>`}
      </g>
      <g font-family="'Special Elite',monospace" font-size="8" letter-spacing="1"
         fill="#B0A28A" text-anchor="middle">
        <text x="46" y="97">CAJA 1</text><text x="150" y="97">CAJA 2</text>
        ${mismo ? '<text x="254" y="97">EN TOTAL</text>' : ''}
      </g>
    </svg>
    <div class="frase">${mismo
      ? 'Trozos iguales: se juntan. ' + ks[0] + '/' + bs[0] + ' + ' + ks[1] + '/' + bs[1]
        + ' = ' + total + '/' + bs[0] + (total > bs[0] ? ', más de una pizza entera.' : '.')
      : 'Una caja en ' + bs[0] + ' y otra en ' + bs[1] + ': trozos distintos no se juntan. '
        + 'Pásales el MISMO cortador.'}</div>
  </div>`;
}
function pintaOperacion(){
  const cont = document.getElementById('opera');
  const p = PEDIDOS[pedido];
  if(p.telefono){ cont.innerHTML = papelPanel(); return; }
  if(p.compara && cajas[0].cortes === cajas[1].cortes){
    const kA = trozosDe(cajas[0]), kB = trozosDe(cajas[1]);
    if(kA && kB && casi(valor(cajas[0]), fVal(p.fA)) && casi(valor(cajas[1]), fVal(p.fB))){
      cont.innerHTML = caraACara(kA, kB, cajas[0].cortes); return;
    }
  }
  /* Mientras el cliente va tocando trozos, el panel enseña la fracción que
     lleva —1/8, 2/8, 3/8…—, que es la que luego entrará en la operación. Sin
     esto, los números aparecían de golpe al cortar o grapar y no se veía de
     dónde salían. */
  if(!ultimaOp){
    if(cajas.length > 1){ cont.innerHTML = panelMesa(); return; }
    const c = cajas[activa], k = trozosDe(c);
    if(!k){ cont.innerHTML = ''; return; }
    cont.innerHTML = `<div class="opera">
      <div class="rot">LLEVAS EN LA CAJA</div>
      <svg viewBox="0 0 300 92">
        <g font-family="'Bree Serif',serif" font-size="30" fill="var(--tinta)" text-anchor="middle">
          <text x="150" y="42">${k}</text><text x="150" y="82">${c.cortes}</text>
        </g>
        <path d="M128 52 H172" stroke="var(--tinta)" stroke-width="2.8" stroke-linecap="round"/>
      </svg></div>`;
    return;
  }
  const {tipo, c, ka, ba, kd, bd} = ultimaOp;
  const signo = tipo === 'corte' ? '·' : ':';
  const col = tipo === 'corte' ? 'var(--tomate)' : 'var(--albahaca)';
  const flecha = (y, dy, txt) => {
    const x0 = 92, x1 = 208, cx = 150, cy = y + dy;
    return `
      <path d="M${x0} ${y} Q${cx} ${cy} ${x1 - 6} ${y}" fill="none" stroke="${col}"
            stroke-width="3" stroke-linecap="round"/>
      ${punta(x1, y, cx, cy, col)}
      <text x="150" y="${dy < 0 ? 26 : 150}" text-anchor="middle"
            font-family="'Bree Serif',serif" font-size="19" fill="${col}">${txt}</text>`;
  };
  cont.innerHTML = `<div class="opera">
    <div class="rot">${tipo === 'corte' ? 'HAS CORTADO' : 'HAS GRAPADO'}</div>
    <svg viewBox="0 0 300 158">
      <g font-family="'Bree Serif',serif" font-size="27" fill="var(--tinta)" text-anchor="middle">
        <text x="80" y="76">${ka}</text><text x="80" y="112">${ba}</text>
        <text x="150" y="96">=</text>
        <text x="220" y="76">${kd}</text><text x="220" y="112">${bd}</text>
      </g>
      <path d="M62 84 H98" stroke="var(--tinta)" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M202 84 H238" stroke="var(--tinta)" stroke-width="2.6" stroke-linecap="round"/>
      ${flecha(58, -30, signo + c)}
      ${flecha(116, 30, signo + c)}
    </svg>
    <div class="frase">${tipo === 'corte'
      ? 'Cortar en ' + c + ' multiplica arriba y abajo por ' + c + '.'
      : 'Grapar de ' + c + ' en ' + c + ' divide arriba y abajo entre ' + c + '.'}</div>
  </div>`;
}

/* ── LA PIZARRA: EL SIGNO ANTES DE LA CUENTA ─────────────────────────
   Davydov hace escribir A > B mucho antes de saber cuánto vale nada: la
   RELACIÓN entre magnitudes viene antes que el número. Aquí, en cuanto las
   dos mesas tienen su pedido preparado y las pizzas siguen cortadas
   distinto —o sea, cuando todavía NO se puede contar—, Nick pide el signo.
   Después se iguala el corte y se comprueba si la apuesta aguantaba.
   El fallo deja de ser un botón rojo y pasa a ser una conjetura que cae. */
let prediccion = null;
const signoReal = p => { const a = fVal(p.fA), b = fVal(p.fB);
  return casi(a, b) ? '=' : (a > b ? '>' : '<'); };
function pintaPizarra(){
  const el = document.getElementById('pizarra'), p = PEDIDOS[pedido];
  if(!p || !p.compara){ el.innerHTML = ''; return; }
  /* La pizarra está desde el primer momento del pedido, antes de tocar una
     sola pizza: el alumno se moja cuando aún no tiene NADA con que contar.
     Esperar a que los pedidos estén preparados sería tarde —entonces ya
     casi se ve la respuesta— y además se podía esquivar igualando los
     cortes antes de elegir los trozos. */
  const izq = '<span class="fA">' + fTxt(p.fA) + '</span>';
  const der = '<span class="fB">' + fTxt(p.fB) + '</span>';
  if(!prediccion){
    el.innerHTML = `<div class="pizarra">
      <div class="rot">LA PIZARRA DE NICK</div>
      <div class="linea">${izq}<span class="hueco-signo">?</span>${der}</div>
      <div class="bots">
        <button data-s="&gt;">&gt;</button><button data-s="=">=</button><button data-s="&lt;">&lt;</button>
      </div>
      <div class="apuesta">SIN CORTAR NADA TODAVÍA: ¿QUÉ SE APUESTA?</div></div>`;
    el.querySelectorAll('.bots button').forEach(b =>
      b.addEventListener('click', () => { prediccion = b.dataset.s; lee(); }));
  }else{
    const bien = prediccion === signoReal(p);
    el.innerHTML = `<div class="pizarra">
      <div class="rot">LA PIZARRA DE NICK</div>
      <div class="linea">${izq}<span class="signo">${prediccion}</span>${der}</div>
      <div class="apuesta">${resuelto
        ? (bien ? 'LA APUESTA AGUANTÓ' : 'LA APUESTA NO AGUANTÓ')
        : 'ESO DICE LA PIZARRA. LA CUENTA LO DIRÁ.'}</div></div>`;
  }
}

/* ── EL TIQUE Y LA REGLA ────────────────────────────────────────────── */
function pintaRegla(){
  const p = PEDIDOS[pedido];
  const cinta = document.getElementById('cinta'), marcas = document.getElementById('marcas');
  cinta.innerHTML = ''; marcas.innerHTML = '';
  const an = cinta.getBoundingClientRect().width;
  /* Cuando se COMPARA, la regla va de 0 a 1: los dos pedidos son de clientes
     distintos y no se suman, así que conviene toda la anchura para separar
     bien las dos marcas. Cuando se SIRVE, la regla llega hasta el número de
     pizzas, porque ahí sí se acumula. */
  const compara = p.compara;
  const tope = compara ? 1 : Math.max(cajas.length, 1);
  const raya = (x, st) => {
    const i = document.createElement('div');
    Object.assign(i.style, {position:'absolute', left:x+'px', width:'1px'}, st);
    cinta.appendChild(i);
  };
  /* LA REGLA DE DOS PEINES. Mientras las pizzas están cortadas distinto,
     cada mesa peina la cinta por su lado: la mesa 4 desde arriba, la 7
     desde abajo, cada una de su color. Las púas no casan: las fracciones
     aún no viven en la misma secuencia y no hay cuenta que hacer. Cuando
     el corte común llega, los dos peines se funden en uno solo, a toda
     altura. Esa imagen ES el denominador común. */
  if(p.telefono){
    if(papel) for(let k = 1; k < 56; k++)
      raya(k*an/56, {top:'0', height:'24px', background:'rgba(110,98,80,.45)'});
    else{
      for(let k = 1; k < p.fA[1]; k++)
        raya(k*an/p.fA[1], {top:'0', height:'10px', background:'rgba(196,70,47,.65)'});
      for(let k = 1; k < p.fB[1]; k++)
        raya(k*an/p.fB[1], {bottom:'0', height:'10px', background:'rgba(47,110,140,.7)'});
    }
  }else if(compara && cajas[0].cortes !== cajas[1].cortes){
    for(let k = 1; k < cajas[0].cortes; k++)
      raya(k*an/cajas[0].cortes, {top:'0', height:'10px', background:'rgba(196,70,47,.65)'});
    for(let k = 1; k < cajas[1].cortes; k++)
      raya(k*an/cajas[1].cortes, {bottom:'0', height:'10px', background:'rgba(47,110,140,.7)'});
  }else{
    /* al servir, cada caja subdivide SU tramo de la regla: la caja 1 el
       [0,1], la caja 2 el [1,2]… antes mandaba siempre la primera */
    for(let u = 0; u < tope; u++){
      const fin = (cajas[u] || cajas[0]).cortes;
      for(let k = 1; k < fin; k++)
        raya((u + k/fin)*an/tope, {top:'0', height:'13px', background:'#8A7A63'});
    }
  }
  for(let u = 0; u <= tope; u++){
    raya(u*an/tope, {top:'0', height:'24px', background:'#6E6250'});
    const b = document.createElement('b'); b.textContent = u; b.style.left = (u*an/tope)+'px';
    cinta.appendChild(b);
  }
  /* el hueco entre las dos marcas, rayado y con nombre, al resolver */
  if(compara && resuelto){
    let kA, kB, den;
    if(p.telefono){ kA = p.fA[0]*p.fB[1]; kB = p.fB[0]*p.fA[1]; den = p.fA[1]*p.fB[1]; }
    else if(cajas[0].cortes === cajas[1].cortes){
      kA = trozosDe(cajas[0]); kB = trozosDe(cajas[1]); den = cajas[0].cortes;
    }
    if(den && kA !== kB && kA > 0 && kB > 0){
      const x0 = Math.min(kA, kB)/den*an, x1 = Math.max(kA, kB)/den*an;
      const h = document.createElement('div'); h.className = 'hueco';
      h.style.left = x0+'px'; h.style.width = (x1 - x0)+'px';
      if(x1 - x0 >= 16){
        const s = document.createElement('span');
        s.textContent = Math.abs(kA - kB) + '/' + den; h.appendChild(s);
      }
      cinta.appendChild(h);
    }
  }
  const marca = (v, clase, txt) => {
    if(v <= 0) return;
    const m = document.createElement('div'); m.className = 'marca ' + clase;
    m.style.left = (v * an / tope) + 'px';
    m.innerHTML = '<em></em><u>' + txt + '</u>'; marcas.appendChild(m);
  };
  if(p.telefono){
    marca(fVal(p.fA), '', papel ? (p.fA[0]*p.fB[1]) + '/' + (p.fA[1]*p.fB[1]) : fTxt(p.fA));
    marca(fVal(p.fB), 'dos', papel ? (p.fB[0]*p.fA[1]) + '/' + (p.fB[1]*p.fA[1]) : fTxt(p.fB));
  }else if(compara){
    marca(valor(cajas[0]), '', corto(trozosDe(cajas[0]), cajas[0].cortes));
    marca(valor(cajas[1]), 'dos', corto(trozosDe(cajas[1]), cajas[1].cortes));
  }else{
    const partes = cajas.map(c => ({k: trozosDe(c), b: c.cortes})).filter(t => t.k > 0);
    const v = cajas.reduce((s, c) => s + valor(c), 0);
    /* la marca lleva el NOMBRE del punto, en fracción. Si las cajas están
       cortadas distinto todavía no hay una fracción que nombrarlo: no se
       pone marca, y el tique explica por qué. */
    if(partes.length && partes.every(t => t.b === partes[0].b))
      marca(v, '', corto(partes.reduce((s2, t) => s2 + t.k, 0), partes[0].b));
  }
  /* si las dos marcas caen cerca, la segunda baja su rótulo para que se lean */
  const ms = marcas.querySelectorAll('.marca');
  if(ms.length === 2){
    const xa = parseFloat(ms[0].style.left), xb = parseFloat(ms[1].style.left);
    if(Math.abs(xa - xb) < 46) ms[1].querySelector('u').style.transform = 'translateY(15px)';
  }
}
function lee(){
  const p = PEDIDOS[pedido];
  const lec = document.getElementById('lec'), des = document.getElementById('desglose');
  if(p.telefono){
    lec.innerHTML = papel
      ? '<b>' + (p.fA[0]*p.fB[1]) + '/' + (p.fA[1]*p.fB[1]) + '</b> frente a '
        + '<b style="color:var(--azul)">' + (p.fB[0]*p.fA[1]) + '/' + (p.fB[1]*p.fA[1]) + '</b>'
      : '<b>' + fTxt(p.fA) + '</b> frente a <b style="color:var(--azul)">' + fTxt(p.fB) + '</b>';
    des.textContent = papel ? 'Misma secuencia de 56: ahora sí se comparan.'
                            : 'Encargo doble: el cortador no llega a 56. Se corta sobre el papel.';
    pintaRegla(); pintaOperacion(); pintaPizarra(); revisa(); return;
  }
  if(p.compara){                        // dos clientes: NO se suma, se compara
    const a = trozosDe(cajas[0]), bb = trozosDe(cajas[1]);
    lec.innerHTML = p.mesas[0] + ': <b>' + (a ? corto(a, cajas[0].cortes) : '—') + '</b>'
      + ' &nbsp;·&nbsp; ' + p.mesas[1] + ': <b style="color:var(--azul)">'
      + (bb ? corto(bb, cajas[1].cortes) : '—') + '</b>';
    des.textContent = a && bb ? 'Dos pedidos distintos: no se suman, se comparan.'
                              : 'Prepara los dos pedidos, uno en cada caja.';
    pintaRegla(); pintaOperacion(); pintaPizarra(); revisa(); return;
  }
  const partes = cajas.map(c => ({k: trozosDe(c), b: c.cortes, v: valor(c)})).filter(t => t.k > 0);
  const total = partes.reduce((s, t) => s + t.v, 0);
  /* si TODA la pizza está grapada en piezas iguales, el denominador ha
     cambiado de verdad y merece decirse: es dividir arriba y abajo */
  const c0 = cajas[activa], gg = grupos(c0), s = gg[0].length;
  const uniforme = gg.length > 1 && gg.every(t => t.length === s) && s > 1;
  if(!partes.length){ lec.innerHTML = '—'; des.textContent = 'Toca las porciones que te llevas.'; }
  else if(partes.length === 1){
    lec.innerHTML = 'Te llevas <b>' + nombre(partes[0].k, partes[0].b) + '</b>';
    des.innerHTML = uniforme
      ? 'La pizza está en <b>' + gg.length + '</b> partes iguales: has dividido arriba y abajo entre ' + s + '.'
      : 'de pizza.';
  }else if(partes.every(t => t.b === partes[0].b)){
    /* trozos iguales: se juntan, y el total se escribe en FRACCIÓN. Antes
       salía en decimales —1,25— y eso es otro tema y otro curso. */
    const k = partes.reduce((s2, t) => s2 + t.k, 0), b = partes[0].b;
    lec.innerHTML = 'Te llevas <b>' + nombre(k, b) + '</b>';
    des.innerHTML = partes.map(t => corto(t.k, t.b)).join(' + ') + ' = ' + corto(k, b)
      + (k > b ? ' · más de una pizza entera' : '');
  }else{
    lec.innerHTML = partes.map(t => '<b>' + corto(t.k, t.b) + '</b>').join(' &nbsp;y&nbsp; ');
    des.innerHTML = 'Trozos distintos: todavía no se juntan. Pásales el <b>mismo cortador</b>.';
  }
  pintaRegla(); pintaOperacion(); pintaPizarra(); revisa();
}

/* ── LA CHARLA Y LA COMPROBACIÓN ────────────────────────────────────── */
function pintaPasos(){
  const el = document.getElementById('pasos'); el.innerHTML = '';
  PEDIDOS.forEach((q, i) => {
    const d = document.createElement('i');
    d.className = (q.compara ? 'vs ' : '') + (i < pedido ? 'hecho' : i === pedido ? 'actual' : '');
    el.appendChild(d);
  });
}
function pintaCharla(remate, feliz){
  const p = PEDIDOS[pedido];
  document.getElementById('charla').innerHTML =
    `<div class="voz cliente"><div class="quien">${p.telefono ? 'AL TELÉFONO' : 'CLIENTE'}`
    + ` · PEDIDO ${pedido+1} DE ${PEDIDOS.length}</div>${p.cli}</div>`
  + `<div class="voz nick${feliz ? ' feliz' : ''}"><div class="cara-caja">${NICK}</div>` +
       `<div class="quien">NICK, EL PIZZERO</div>${remate || p.nick}</div>`
  + (remate ? '' : `<div class="pista">${p.pista}</div>`);
}
/* LA PREGUNTA. Con las dos fracciones del pedido, las opciones y la
   respuesta buena se fabrican solas —incluida la de «los dos igual», que en
   el peldaño de los disfrazados por fin es la buena—.                    */
function ponPregunta(p){
  const fila = document.getElementById('filaResp');
  fila.dataset.puesta = '1'; fila.innerHTML = '';
  const q = document.createElement('span'); q.className = 'etq';
  q.textContent = '¿quién se lleva más?'; fila.appendChild(q);
  const va = fVal(p.fA), vb = fVal(p.fB), iguales = casi(va, vb);
  [['El de ' + fTxt(p.fA), !iguales && va > vb, 'A'],
   ['El de ' + fTxt(p.fB), !iguales && vb > va, 'B'],
   ['Los dos igual', iguales, 'ig']].forEach(([txt, bien, clave]) => {
    const bt = document.createElement('button'); bt.className = 'b'; bt.textContent = txt;
    bt.addEventListener('click', () => {
      if(bien){
        resuelto = true; fila.innerHTML = '';
        /* si hubo apuesta en la pizarra, Nick la recoge antes de explicar:
           el alumno ve aguantar —o caer— su propia conjetura */
        const guiño = !prediccion ? ''
          : prediccion === signoReal(p)
            ? 'Y lo que apuntó en la pizarra iba bien encaminado. '
            : 'La pizarra decía otra cosa, ¿eh? Por algo se cuenta antes de cobrar. ';
        /* una sola raya de diálogo: el guiño y la explicación son la misma
           intervención de Nick, no dos */
        pintaCharla(guiño ? '—' + guiño + p.ok.replace(/^—/, '') : p.ok, true); siguiente();
        pintaRegla(); pintaOperacion(); pintaPizarra();
      }else{
        /* LA RESPUESTA MALA CASI NUNCA ES UN DESPISTE: suele ser una regla
           razonable aplicada donde no vale. Nick la dice en voz alta y la
           refuta con algo que el alumno YA ha vivido en un pedido anterior.
           Es la diferencia entre corregir y escuchar. */
        const rep = (p.rep || {})[clave];
        if(rep) pintaCharla(rep, false);
        document.getElementById('desglose').textContent =
          p.mal || 'Mira la regla: se lleva más el que cae más a la derecha.';
      }
    });
    fila.appendChild(bt);
  });
}
function revisa(){
  const p = PEDIDOS[pedido], fila = document.getElementById('filaResp');
  if(resuelto) return;
  if(p.telefono) return;              // su pregunta la pone el corte sobre el papel
  if(p.compara){
    const okA = casi(valor(cajas[0]), fVal(p.fA));
    const okB = casi(valor(cajas[1]), fVal(p.fB));
    const igual = cajas[0].cortes === cajas[1].cortes;
    /* La pregunta no se abre hasta que las dos pizzas están cortadas IGUAL:
       con trozos distintos no hay cuenta que valga. Solo el peldaño del
       mismo numerador va libre, porque ahí el argumento es otro: el tamaño
       del trozo. Y si el alumno deshace lo preparado, la pregunta se
       retira: nada de responder sobre una foto vieja. */
    const listo = okA && okB && (p.libre || igual);
    if(listo && !fila.dataset.puesta) ponPregunta(p);
    else if(!listo && fila.dataset.puesta){ fila.innerHTML = ''; delete fila.dataset.puesta; }
    if(okA && okB && !igual && !p.libre)
      document.getElementById('desglose').textContent =
        'Los dos pedidos están listos: ahora pásales el MISMO cortador. '
        + 'Con trozos distintos no hay cuenta que valga.';
    return;
  }
  /* Con dos cajas, el pedido no se da por bueno hasta que los trozos son
     IGUALES: la cantidad puede salir, pero «media y un cuarto» sin igualar
     el corte no es el pedido que Nick ha explicado. */
  const trozos = cajas.map(c => ({k: trozosDe(c), b: c.cortes})).filter(t => t.k > 0);
  const juntables = trozos.length < 2 || trozos.every(t => t.b === trozos[0].b);
  if(juntables && p.meta(cajas.reduce((s, c) => s + valor(c), 0))){ pintaCharla(p.ok, true); siguiente(); }
}
function siguiente(){
  const fila = document.getElementById('filaResp');
  if(document.getElementById('bSig')) return;
  if(pedido >= PEDIDOS.length - 1){
    const fin = document.createElement('span'); fin.className = 'etq';
    fin.textContent = '· SERVICIO TERMINADO · NICK INVITA AL CAFÉ ·'; fila.appendChild(fin);
    return;
  }
  const bt = document.createElement('button');
  bt.className = 'b verde'; bt.id = 'bSig'; bt.textContent = 'Siguiente pedido →';
  bt.addEventListener('click', () => { pedido++; monta(); });
  fila.appendChild(bt);
}
function monta(){
  ultimaOp = null; resuelto = false; papel = false; armado = null; prediccion = null;
  const p = PEDIDOS[pedido];
  cajas = (p.cajas || []).map(nuevaCaja);
  activa = 0;
  const fila = document.getElementById('filaResp');
  fila.innerHTML = ''; delete fila.dataset.puesta;
  const tel = !!p.telefono;
  document.getElementById('mesa').style.display = tel ? 'none' : 'flex';
  ['filaCortes', 'filaInd', 'filaBotones'].forEach(id =>
    document.getElementById(id).style.display = tel ? 'none' : 'flex');
  pintaPasos(); pintaCharla();
  if(tel){
    const bt = document.createElement('button');
    bt.className = 'b acc'; bt.textContent = 'Cortar sobre el papel';
    bt.addEventListener('click', () => { papel = true; lee(); ponPregunta(p); });
    fila.appendChild(bt);
    lee(); return;
  }
  pinta(); lee();
}

/* ── LA GRAPADORA. Solo une piezas CONTIGUAS: dos cuartos separados suman
      lo mismo, pero no forman media pizza dentro de la caja.            */
document.getElementById('bGrapar').addEventListener('click', () => {
  const c = cajas[activa], n = c.cortes, des = document.getElementById('desglose');
  const gs = grupos(c).filter(t => c.sel.has(t[0]));
  if(gs.length < 2){ des.textContent = 'La grapadora necesita dos piezas o más, y pegadas.'; return; }
  const todos = gs.flat(), dentro = new Set(todos);
  let hecho = false, nJuntos = 0;
  for(let ini = 0; ini < n && !hecho; ini++){
    if(!dentro.has(ini)) continue;
    let ok = true;
    for(let k = 0; k < todos.length; k++) if(!dentro.has((ini + k) % n)){ ok = false; break; }
    if(!ok) continue;
    hecho = true; c.recien.clear();
    /* GRAPAR A MANO TAMBIÉN ES DIVIDIR. Si junto n trozos de 1/b y n cabe en
       b, mi pieza pasa a ser 1 de las b/n que saldrían: n/b = 1/(b/n), o sea
       dividir arriba y abajo entre n. Si n no cabe en b —tres octavos, por
       ejemplo—, no hay tal división y no se enseña ninguna. */
    nJuntos = todos.length;
    ultimaOp = (n % nJuntos === 0 && nJuntos > 1)
      ? {tipo:'grapa', c: nJuntos, ka: nJuntos, ba: n, kd: 1, bd: n / nJuntos}
      : null;
    for(let k = 0; k < todos.length - 1; k++){
      const junta = (ini + k) % n;
      if(!c.grapas[junta]) c.recien.add(junta);
      c.grapas[junta] = true;
    }
    c.sel.clear(); c.sel.add(ini);
  }
  if(!hecho){
    des.textContent = 'Esas piezas no están pegadas: sueltas suman lo mismo, pero no forman una.';
    return;
  }
  pinta(); lee();
  /* Y CUANDO CALLA, DICE POR QUÉ. La pieza de 3/8 existe —ahí está,
     grapada—, pero 3 no cabe en 8: no es 1 de nada entero, y por eso la
     operación no enseña división ninguna. El silencio, explicado.        */
  if(!ultimaOp && nJuntos > 1 && n % nJuntos !== 0)
    des.innerHTML = 'Una pieza de <b>' + nJuntos + '/' + n + '</b>… pero ' + nJuntos
      + ' no cabe en ' + n + ': esa pieza no es 1 de nada entero, y por eso aquí '
      + 'no hay división que enseñar.';
  clearTimeout(monta.reloj);
  monta.reloj = setTimeout(() => { cajas.forEach(x => x.recien.clear()); pinta(); }, 2600);
});
document.getElementById('bSoltar').addEventListener('click', () => {
  const c = cajas[activa];
  c.grapas = new Array(c.cortes).fill(false); c.sel.clear(); c.recien.clear();
  pinta(); lee();
});
document.getElementById('bLimpiar').addEventListener('click', monta);
addEventListener('resize', () => pintaRegla());
monta();
</script>
